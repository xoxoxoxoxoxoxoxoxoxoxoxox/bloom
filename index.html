        $('[data-reset]', b).onclick = async () => {
          const ok = await UI.dialog('Alles zurücksetzen?', 'Alle Einheiten, Abzeichen und Pflanzen auf diesem Gerät werden gelöscht. Erstelle vorher am besten einen Sicherungscode.', [{ l: 'Abbrechen', v: false }, { l: 'Zurücksetzen', v: true, primary: true }]);
          if (!ok) return; Store.reset(); close(); location.hash = 'garten'; location.reload();
        };
      };
      bind();
    }
  });
}
function homeSheet() {
  UI.sheet('Zum Home-Bildschirm', `<p class="muted">So öffnest du Bloom wie eine App mit einem Tipp.</p>
    <div class="card" style="margin-top:12px"><h3>iPhone</h3><ol style="padding-left:20px;margin:6px 0 0"><li>Öffne den Link zu Bloom in Safari.</li><li>Tipp unten auf Teilen.</li><li>Wähle „Zum Home-Bildschirm“.</li></ol></div>
    <div class="card" style="margin-top:10px"><h3>Android</h3><ol style="padding-left:20px;margin:6px 0 0"><li>Öffne den Link zu Bloom in Chrome.</li><li>Tipp oben rechts auf das Menü.</li><li>Wähle „Zum Startbildschirm hinzufügen“.</li></ol></div>
    <p class="small muted" style="margin-top:12px">Wichtig: Immer denselben Browser nutzen, denn dort liegen deine Daten.</p>`);
}

/* ---------- Onboarding ---------- */
function onboarding() {
  const o = document.createElement('div'); o.className = 'onb'; o.setAttribute('role', 'dialog'); o.setAttribute('aria-label', 'Willkommen');
  document.body.appendChild(o);
  let step = 0, scene = null;
  const panes = [
    () => `<div class="pane"><div class="scene-wrap" id="onbScene"></div><h1>Willkommen in deinem Trainingsgarten</h1><p class="lead">Hier wächst eine Pflanze mit deinem Training. Jede Einheit gießt sie, Woche für Woche wird sie größer, bis sie blüht.</p></div>`,
    () => `<div class="pane"><h1>So funktioniert's</h1>
      <div class="rule"><span class="ic-wrap" style="background:var(--sky-soft);color:#2D5D80">${ic('drop')}</span><div><b>Drei Mal pro Woche gießen</b><p class="small muted">An freien Tagen. Zwei Mal Beine & Po mit Abs, ein Mal Arme & Rücken.</p></div></div>
      <div class="rule"><span class="ic-wrap" style="background:var(--peach-soft);color:#8A4A32">${ic('sparkle')}</span><div><b>Dünger und Sonnenlicht</b><p class="small muted">Eine vierte Einheit gibt Dünger. Der Abs Zirkel gibt Sonnenlicht für Deko.</p></div></div>
      <div class="rule"><span class="ic-wrap" style="background:var(--mint-soft);color:#2F6148">${ic('heart')}</span><div><b>Sie stirbt nie</b><p class="small muted">Bei einer Pause lässt sie die Blätter hängen. Nach dem nächsten Training richtet sie sich wieder auf.</p></div></div></div>`,
    () => `<div class="pane"><h1>Gib deiner Pflanze einen Namen</h1><p class="lead">Du kannst ihn später jederzeit ändern.</p><input type="text" id="onbName" maxlength="24" placeholder="Zum Beispiel Mila" aria-label="Name der Pflanze"><div class="scene-wrap" id="onbScene2" style="max-width:240px"></div></div>`
  ];
  const render = () => {
    o.innerHTML = panes[step]() + `<div class="dots">${panes.map((_, i) => `<i class="${i === step ? 'on' : ''}"></i>`).join('')}</div>
      <div class="row">${step ? `<button class="btn white" data-b aria-label="Zurück">${ic('chevL', 'sm')}</button>` : ''}<button class="btn grow" data-n>${step === 2 ? ic('sprout', 'sm') + ' Samen pflanzen' : 'Weiter'}</button></div>`;
    if (!FX.reduced()) gsap.fromTo(o.querySelector('.pane').children, { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: .45, stagger: .06, ease: 'power3.out' });
    const host = $('#onbScene', o) || $('#onbScene2', o);
    if (scene) { scene.destroy(); scene = null; }
    if (host) { scene = new Scene.SceneView(host, { potHref: POT_IMG, seed: Store.activePlant().seed, g: step === 0 ? 6.2 : 0, wilt: 0 }); }
    $('[data-b]', o) && ($('[data-b]', o).onclick = () => { step--; render(); });
    $('[data-n]', o).onclick = async () => {
      if (step < 2) { step++; render(); return; }
      const name = $('#onbName', o).value.trim();
      const pl = Store.activePlant(); if (name) pl.name = name.slice(0, 24);
      pl.startedAt = Date.now();
      $('[data-n]', o).disabled = true; if ($('[data-b]', o)) $('[data-b]', o).disabled = true;
      // Samen fällt in die Erde
      const svg = host.querySelector('.sc-front');
      const soil = scene.toScene(292, 60);
      const seed = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
      seed.setAttribute('rx', 5); seed.setAttribute('ry', 3.5); seed.setAttribute('cx', soil[0]); seed.setAttribute('cy', soil[1] - 160); seed.setAttribute('fill', '#9C7656');
      svg.appendChild(seed);
      FX.play('tap');
      await gsap.fromTo(seed, { attr: { cx: soil[0], cy: soil[1] - 160 } }, { attr: { cy: soil[1] }, duration: .8, ease: 'bounce.out' });
      seed.remove(); FX.play('drop');
      const rc = host.getBoundingClientRect(); FX.sparks(rc.left + rc.width / 2, rc.top + rc.height * .6, 12, '#9CCBB2');
      await scene.grow(.3);
      FX.play('chime');
      await wait(600);
      S().onboarded = true; Store.save();
      if (name) { const fresh = Store.checkAchievements(); UI.queue(() => UI.achBatch(fresh)); }
      scene.destroy();
      gsap.to(o, { opacity: 0, y: 20, duration: .35, ease: 'power2.in', onComplete: () => { o.remove(); route(); updateDots(); } });
    };
  };
  render();
}

/* ---------- Start ---------- */
const RENDER = { garten: renderGarden, training: renderTraining, verlauf: renderProgress, erfolge: renderAch, mehr: renderMore };
function init() {
  nav();
  document.documentElement.classList.toggle('rm', FX.reduced());
  window.addEventListener('hashchange', route);
  if (!S().onboarded) onboarding();
  else route();
  if (Store.loadError()) setTimeout(() => UI.dialog('Daten nicht lesbar', 'Die gespeicherten Daten konnten nicht gelesen werden. Eine Kopie wurde aufgehoben. Du kannst unter Mehr einen Sicherungscode einspielen.'), 600);
  if (S().onboarded) { const fr = Store.checkAchievements(); if (fr.length) UI.queue(() => UI.achBatch(fr)); }
  if (S().run && S().onboarded) { if (Date.now() - S().run.start < 3 * 3600e3) setTimeout(() => Player.open(), 400); else setTimeout(() => UI.toast('Dein Training ist noch offen. Im Garten kannst du weitermachen.'), 900); }
  setInterval(() => { if (App.screen === 'garten' && App.scene && !App.scene.busy) App.scene.update(); }, 5 * 60 * 1000);
  updateDots();
}
init();

</script>
