<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBF3EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bloom">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Bloom · Trainingsgarten</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<style>
/*
VOICE: zart, ermutigend, spielerisch wie ein Gartentagebuch
IDEA: ein Pflanzenalbum auf der Fensterbank, Training gießt die Pflanze
PICTURE: Aquarell-Fensterbank mit wachsender Pflanze, Tageszeit und Jahreszeit im Fenster
COLOUR and TYPE: Creme, Lavendel, Pfirsich, Mint, Himmelblau als Wasser. Lora und Nunito Sans
LAYOUT: Handy zuerst, eine Spalte, Tab-Leiste unten, Bögen und Karten statt Raster
*/
:root{color-scheme:light;
--bg:#FBF3EC;--surface:#FFFFFF;--hero:#F5E8EF;--line:#EEDFE6;--ink:#423748;--muted:#6E6175;--accent:#8C78BF;--accent-soft:#E6DDF5;
--btn:#7360A8;--btn-ink:#FFFFFF;--drop:#78AFD6;--drop-empty:#C7D9E6;--glow:rgba(183,166,217,.45);--spark:#E9A58A;
--mint:#9CCBB2;--mint-soft:#E3F1E9;--peach:#F2B8A0;--peach-soft:#FCE6DA;--terra:#E7A588;--sky-soft:#E4EFF8;
--display:"Lora",Georgia,serif;--body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
--r-hero:34px;--r-card:22px;--r-btn:999px;
--ease-out:cubic-bezier(0.23,1,0.32,1);--ease-io:cubic-bezier(0.77,0,0.175,1);
--nav-h:68px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:light}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);overflow-x:clip}
body{min-height:100dvh}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:30px}h2{font-size:22px}h3{font-size:18px}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:18px;height:18px}.ic.lg{width:28px;height:28px}
.muted{color:var(--muted)}.small{font-size:13px}.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2.5px solid var(--btn);outline-offset:2px;border-radius:12px}

/* App-Gerüst */
#app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative;padding-bottom:calc(var(--nav-h) + var(--safe-b) + 16px)}
.screen{padding:calc(14px + var(--safe-t)) 16px 8px;display:none}
.screen.on{display:block}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 2px 14px}
.top .sub{font-size:14px;color:var(--muted);margin-top:4px}
.stack>*+*{margin-top:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1}

/* Navigation */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;pointer-events:none}
.nav-in{pointer-events:auto;width:100%;max-width:480px;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--safe-b))}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;min-height:52px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:600;border-radius:16px;transition:color .2s,transform .16s var(--ease-out)}
.nav a:active{transform:scale(.95)}
.nav a.on{color:var(--btn)}
.nav a .pill{width:52px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .25s var(--ease-out)}
.nav a.on .pill{background:var(--accent-soft)}
.nav .dot{position:absolute;margin:-18px 0 0 22px;width:8px;height:8px;border-radius:50%;background:var(--terra);display:none}
.nav a.has .dot{display:block}

/* Karten, Knöpfe */
.card{background:var(--surface);border-radius:var(--r-card);padding:16px;box-shadow:0 1px 0 var(--line),0 8px 24px -18px rgba(66,55,72,.35)}
.card.soft{background:var(--hero);box-shadow:none}
.card.mint{background:var(--mint-soft);box-shadow:none}
.card.peach{background:var(--peach-soft);box-shadow:none}
.card.lav{background:var(--accent-soft);box-shadow:none}
.card.sky{background:var(--sky-soft);box-shadow:none}
.card h3{margin-bottom:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:var(--r-btn);background:var(--btn);color:var(--btn-ink);font-weight:700;font-size:16px;transition:transform .16s var(--ease-out),background .2s,box-shadow .2s;box-shadow:0 6px 18px -8px rgba(115,96,168,.7)}
.btn:active{transform:scale(.97)}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--btn);box-shadow:inset 0 0 0 1.5px var(--accent-soft)}
.btn.soft{background:var(--accent-soft);color:#4F3F86;box-shadow:none}
.btn.white{background:#fff;color:var(--btn);box-shadow:0 1px 0 var(--line)}
.btn.sm{min-height:40px;padding:0 16px;font-size:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink);transition:transform .16s var(--ease-out),background .2s}
.iconbtn:active{transform:scale(.94)}
.iconbtn.bg{background:#fff;box-shadow:0 1px 0 var(--line)}
@media (hover:hover) and (pointer:fine){.btn:hover{background:#65529A}.btn.ghost:hover,.btn.soft:hover{background:var(--accent-soft)}.btn.white:hover{background:#FBF8FD}.iconbtn:hover{background:rgba(140,120,191,.12)}.listrow:hover{background:#FCF9FB}.nav a:hover{color:var(--btn)}}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border-radius:999px;background:#fff;font-size:13px;font-weight:700;color:var(--ink);box-shadow:0 1px 0 var(--line);white-space:nowrap}
.chip.on{background:var(--btn);color:#fff;box-shadow:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:#4F3F86}
.tag.peach{background:var(--peach-soft);color:#8A4A32}.tag.mint{background:var(--mint-soft);color:#2F6148}.tag.sky{background:var(--sky-soft);color:#2D5D80}

/* Szene */
.hero{position:relative;border-radius:var(--r-hero);overflow:hidden;background:var(--hero);box-shadow:0 18px 40px -28px rgba(66,55,72,.55)}
.scene{position:relative;width:100%;aspect-ratio:400/540;overflow:hidden;isolation:isolate}
.scene>svg,.scene>.plantbox,.scene>.grain{position:absolute;left:0;width:100%}
.sc-back{top:0;height:100%}
.sc-front{top:0;height:100%;pointer-events:none;z-index:3}
.plantbox{top:0;height:72.96%;z-index:2}
.plantsvg{width:100%;height:100%;display:block;overflow:visible}
.plant-hit{cursor:pointer}
.grain{inset:0;height:100%;mix-blend-mode:multiply;opacity:.22;pointer-events:none;z-index:4;background-size:192px 192px}
.scene[data-tod=night] .grain{opacity:.16}
.hero-panel>*{flex:none}
.hero-panel{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:10px 16px 14px;height:22%;display:flex;flex-direction:column;justify-content:flex-end;gap:6px}
.hero-name{display:flex;align-items:center;gap:6px;font-family:var(--display);font-size:20px;font-weight:600}
.hero-name button{display:inline-flex;align-items:center;gap:6px;min-height:36px}
.stage-line{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted);font-weight:600}
.bar{height:10px;border-radius:999px;background:rgba(255,255,255,.92);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(140,120,191,.18)}
.bar>i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--mint),#8FC2A8);transform-origin:left;transition:transform .9s var(--ease-out)}
.hero-chips{position:absolute;top:12px;left:12px;right:12px;z-index:5;display:flex;justify-content:space-between;pointer-events:none}
.hero-chips .chip{pointer-events:auto;background:rgba(255,255,255,.86);backdrop-filter:blur(6px)}
.bubble{position:absolute;z-index:6;left:50%;top:14%;transform:translateX(-50%);max-width:78%;background:#fff;border-radius:18px;padding:10px 14px;font-size:14px;font-weight:600;box-shadow:0 10px 24px -14px rgba(66,55,72,.6);text-align:center;pointer-events:none}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;width:14px;height:14px;background:#fff;transform:translateX(-50%) rotate(45deg);border-radius:3px}
.thirst{display:flex;gap:10px;align-items:center;background:var(--peach-soft);color:#6A3A27;border-radius:18px;padding:12px 14px;font-weight:600;font-size:14px}

/* Szenen-Animationen */
.star{animation:tw 3s ease-in-out infinite;animation-delay:var(--d)}
@keyframes tw{50%{opacity:.25}}
.fall{animation:fall var(--t) linear infinite;animation-delay:var(--d)}
@keyframes fall{0%{transform:translate(var(--x),10px) rotate(0)}100%{transform:translate(calc(var(--x) + 40px),400px) rotate(320deg)}}
.cl1{animation:drift 40s linear infinite}.cl2{animation:drift 55s linear infinite reverse}
@keyframes drift{50%{transform:translateX(26px)}}
.fly{animation:fly var(--t) ease-in-out infinite;animation-delay:var(--d);filter:drop-shadow(0 0 4px #FFE58A)}
@keyframes fly{0%,100%{transform:translate(var(--x),var(--y));opacity:.2}50%{transform:translate(calc(var(--x) + 18px),calc(var(--y) - 22px));opacity:1}}
.bulb .bglow{animation:tw 2.4s ease-in-out infinite;animation-delay:var(--d)}
.flame{transform-origin:0 -31px;animation:flick 1.6s ease-in-out infinite}
@keyframes flick{50%{transform:scale(.9,1.08) rotate(3deg)}}
.mobile .sw1,.mobile .sw2,.mobile .sw3{transform-box:fill-box;transform-origin:50% 0;animation:sway 4s ease-in-out infinite}
.mobile .sw2{animation-delay:-1.3s}.mobile .sw3{animation-delay:-2.4s}
@keyframes sway{50%{transform:rotate(7deg)}}
.drop-l{animation:rainf .7s linear infinite;animation-delay:var(--d)}
@keyframes rainf{0%{transform:translate(var(--x),20px)}100%{transform:translate(calc(var(--x) - 20px),380px)}}
.butterfly{animation:bfly 14s ease-in-out infinite}
@keyframes bfly{0%{transform:translate(90px,220px)}25%{transform:translate(180px,150px) scale(.9)}50%{transform:translate(280px,210px)}75%{transform:translate(200px,280px) scale(1.1)}100%{transform:translate(90px,220px)}}
.bird{animation:hop 6s ease-in-out infinite}
@keyframes hop{0%,80%,100%{transform:translate(var(--bx,0),0)}85%{transform:translateY(-4px)}}

/* Wochenziel */
.drops{display:flex;gap:10px;align-items:center}
.dropi{width:34px;height:40px;position:relative}
.dropi svg{width:100%;height:100%;overflow:visible}
.dropi .bgd{fill:var(--drop-empty)}
.dropi .fgd{fill:var(--drop);transform-origin:50% 100%;transform:scaleY(0)}
.dropi.full .fgd{transform:scaleY(1)}
.dropi.fert .fgd{fill:var(--terra)}
.dropi .shine{fill:#fff;opacity:0}
.dropi.full .shine{opacity:.55}

/* Liste */
.list{background:#fff;border-radius:var(--r-card);overflow:hidden;box-shadow:0 1px 0 var(--line)}
.listrow{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:56px;width:100%;text-align:left;border-bottom:1px solid var(--line);transition:background .15s}
.listrow:last-child{border-bottom:0}
.listrow .ic-wrap{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:#4F3F86;flex:none}
.listrow .t{font-weight:700}
.listrow .s{font-size:13px;color:var(--muted)}

/* Training */
.wcard{border-radius:var(--r-card);padding:16px;position:relative;overflow:hidden}
.wcard.peach{background:var(--peach-soft)}.wcard.mint{background:var(--mint-soft)}.wcard.lav{background:var(--accent-soft)}
.wcard .exl{margin:10px 0 14px;padding:0;list-style:none;font-size:14px}
.wcard .exl li{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed rgba(66,55,72,.12)}
.wcard .exl li:last-child{border:0}
.wcard .rec{position:absolute;top:14px;right:14px}
.exgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.extile{background:#fff;border-radius:18px;padding:8px 8px 10px;text-align:left;box-shadow:0 1px 0 var(--line);transition:transform .16s var(--ease-out)}
.extile:active{transform:scale(.97)}
.extile svg.fig{width:100%;aspect-ratio:200/160;display:block;background:#FBF7FA;border-radius:12px}
.extile .t{font-size:14px;font-weight:700;margin-top:6px;line-height:1.25}
.extile .s{font-size:12px;color:var(--muted)}

/* Spieler */
.player{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;max-width:480px;margin:0 auto}
.pl-top{display:flex;align-items:center;gap:8px;padding:calc(10px + var(--safe-t)) 12px 6px}
.pl-top .ttl{flex:1;text-align:center;font-weight:700;font-size:15px}
.pl-top .time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;min-width:52px;text-align:right}
.pl-prog{display:flex;gap:4px;padding:0 16px 8px}
.pl-prog i{flex:1;height:5px;border-radius:3px;background:var(--line);transition:background .3s}
.pl-prog i.done{background:var(--mint)}.pl-prog i.cur{background:var(--accent)}
.pl-body{flex:1;overflow-y:auto;padding:4px 16px 16px}
.pl-foot{padding:10px 16px calc(12px + var(--safe-b));display:flex;gap:8px;background:linear-gradient(transparent,var(--bg) 30%)}
.exhead{display:flex;gap:12px;align-items:center;margin:6px 0 12px}
.exhead svg.fig{width:112px;flex:none;aspect-ratio:200/160;background:#fff;border-radius:16px}
.exhead h2{font-size:22px}
.target{font-size:14px;color:var(--muted);font-weight:600;margin-top:4px}
.sugg{display:flex;gap:10px;align-items:center;background:var(--mint-soft);color:#2F6148;padding:10px 12px;border-radius:16px;font-size:14px;font-weight:600;margin-bottom:10px}
.setrow{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1fr) 52px;gap:8px;align-items:center;background:#fff;border-radius:18px;padding:8px;margin-bottom:8px;box-shadow:0 1px 0 var(--line);transition:background .3s,opacity .3s}
.setrow.done{background:var(--mint-soft)}
.setrow.cur{box-shadow:0 0 0 2px var(--accent-soft),0 1px 0 var(--line)}
.setrow .n{font-weight:800;color:var(--muted);text-align:center}
.step{display:flex;align-items:center;background:var(--bg);border-radius:14px;height:48px}
.step button{width:38px;height:48px;display:grid;place-items:center;color:var(--btn)}
.step input{width:100%;text-align:center;border:0;background:transparent;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;padding:0;-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none}
.sethead{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1fr) 52px;gap:8px;padding:0 8px 6px;font-size:12px;font-weight:700;color:var(--muted);text-align:center}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pl-foot .btn{min-width:0}
.setrow .ok{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--btn);transition:transform .16s var(--ease-out),background .2s}
.setrow .ok:active{transform:scale(.92)}
.setrow.done .ok{background:var(--mint);color:#fff}
.sides{display:flex;gap:6px;grid-column:2/4}
.sides span{flex:1;text-align:center;font-size:12px;font-weight:800;padding:4px 0;border-radius:10px;background:var(--bg);color:var(--muted)}
.sides span.sd-on{background:var(--accent-soft);color:#4F3F86}
.sides span.sd-ok{background:var(--mint);color:#fff}
.exnote{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.rest{position:fixed;inset:auto 0 0 0;z-index:60;display:flex;justify-content:center;pointer-events:none}
.rest-in{pointer-events:auto;width:100%;max-width:480px;background:#fff;border-radius:28px 28px 0 0;padding:16px 18px calc(18px + var(--safe-b));box-shadow:0 -14px 40px -24px rgba(66,55,72,.5);display:flex;gap:16px;align-items:center}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .rt{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.absring{width:230px;height:230px;margin:6px auto}
.absring .rt{font-size:52px;font-family:var(--display)}
.absnext{text-align:center;color:var(--muted);font-weight:600;margin-top:6px}
.abslist{display:flex;gap:5px;justify-content:center;margin:12px 0}
.abslist i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.abslist i.done{background:var(--mint)}.abslist i.cur{background:var(--accent);transform:scale(1.3)}
.feel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.feel button{background:#fff;border-radius:18px;padding:14px 6px;font-weight:700;box-shadow:0 1px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .16s var(--ease-out),background .2s}
.feel button.on{background:var(--accent-soft);color:#4F3F86;box-shadow:inset 0 0 0 2px var(--accent)}
.feel button:active{transform:scale(.96)}
textarea,input[type=text]{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:12px 14px;font-size:16px;resize:vertical}
textarea:focus,input[type=text]:focus{outline:none;border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:#fff;border-radius:18px;padding:12px 14px;box-shadow:0 1px 0 var(--line)}
.stat b{display:block;font-family:var(--display);font-size:26px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat span{font-size:13px;color:var(--muted);font-weight:600}

/* Sheets und Dialoge */
.backdrop{position:fixed;inset:0;z-index:70;background:rgba(66,55,72,.32);opacity:0}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;margin:0 auto;max-width:480px;max-height:92dvh;background:var(--bg);border-radius:30px 30px 0 0;display:flex;flex-direction:column;transform:translateY(100%)}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:#DCCFD8;margin:10px auto 4px;flex:none}
.sheet .sh-head{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 18px}
.sheet .sh-head h2{flex:1}
.sheet .sh-body{overflow-y:auto;padding:6px 18px calc(22px + var(--safe-b))}
.dialog{position:fixed;z-index:81;left:50%;top:50%;width:min(92vw,380px);background:#fff;border-radius:26px;padding:22px;opacity:0;box-shadow:0 30px 60px -30px rgba(66,55,72,.6)}
.dialog h3{margin-bottom:8px}
.dialog .acts{display:flex;gap:8px;margin-top:18px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--safe-b) + 14px);z-index:90;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:700;max-width:90vw;text-align:center;pointer-events:none}
.celebrate{position:fixed;inset:0;z-index:85;display:grid;place-items:center;padding:24px;background:rgba(66,55,72,.38);opacity:0}
.cel-card{width:min(100%,360px);background:#fff;border-radius:30px;padding:26px 22px 20px;text-align:center;transform:scale(.92);position:relative;overflow:hidden}
.cel-card .badgebig{width:150px;height:150px;margin:0 auto 10px;display:block}
.cel-card .rar{margin-bottom:6px}
.cel-card h2{margin:6px 0 6px}
.cel-card .shine{position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.7),transparent 30%);opacity:.0;pointer-events:none}
#fxLayer{position:fixed;inset:0;pointer-events:none;z-index:95;overflow:hidden}
.petal{position:absolute;width:10px;height:7px;border-radius:70% 0 70% 0}
.spark{position:absolute;width:8px;height:8px;margin:-4px 0 0 -4px;background:currentColor;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}

/* Erfolge */
.achgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ach{background:#fff;border-radius:18px;padding:10px 6px 12px;text-align:center;box-shadow:0 1px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .16s var(--ease-out)}
.ach:active{transform:scale(.96)}
.ach svg{width:72px;height:72px}
.ach .t{font-size:12.5px;font-weight:700;line-height:1.2}
.ach.locked .t{color:var(--muted)}
.ach .new{position:absolute;margin:-6px 0 0 54px;background:var(--terra);color:#fff;font-size:10px;font-weight:800;padding:1px 6px;border-radius:999px}
.achhead{display:flex;align-items:center;gap:14px}
.rarrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;flex:1}
.rarrow div{text-align:center;background:#fff;border-radius:14px;padding:6px 2px}
.rarrow b{display:block;font-family:var(--display);font-size:20px}
.rarrow span{font-size:11px;font-weight:700;color:var(--muted)}
.ringsm{width:64px;height:64px}
.prog{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:inherit}

/* Fortschritt */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,auto);grid-auto-columns:minmax(0,1fr);gap:3px}
.heat i{aspect-ratio:1;border-radius:4px;background:#F1E8EE}
.heat i.LA{background:var(--peach)}.heat i.LB{background:var(--mint)}.heat i.AR{background:#B9A3D6}.heat i.today{box-shadow:inset 0 0 0 2px var(--ink)}
.heat i.fut{background:transparent}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:600;margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:4px;display:inline-block}
.chartfig{position:relative;min-height:200px}
.chartfig>svg{position:absolute;inset:0;width:100%;height:100%}
.chart text{font-size:11px;fill:var(--muted);font-family:var(--body)}
.herb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;background:#FFFDF8;border-radius:22px;padding:14px;box-shadow:0 1px 0 var(--line);background-image:repeating-linear-gradient(0deg,transparent 0 27px,rgba(238,223,230,.5) 27px 28px)}
.herb .pg{aspect-ratio:3/4;background:#fff;border-radius:6px;box-shadow:0 2px 6px -3px rgba(66,55,72,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:6px}
.herb .pg svg{width:80%;height:72%}
.herb .pg .d{font-size:11px;color:var(--muted);font-weight:700;margin-top:2px;white-space:nowrap}
.herb .tape{position:absolute;top:-5px;left:50%;width:34px;height:12px;background:rgba(242,184,160,.55);transform:translateX(-50%) rotate(-4deg)}
.herb .pg.empty{background:transparent;box-shadow:inset 0 0 0 1.5px dashed var(--line);border:1.5px dashed var(--line)}
.sess{display:flex;gap:12px;align-items:center}
.sess .dt{width:46px;text-align:center;flex:none}
.sess .dt b{display:block;font-family:var(--display);font-size:22px;line-height:1}
.sess .dt span{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase}

/* Bibliothek, Wissen */
.guide ol{padding-left:20px;margin:6px 0}
.guide li{margin:6px 0}
.guide .err li{list-style:none;position:relative;padding-left:22px}
.guide .err li::before{content:"";position:absolute;left:2px;top:.55em;width:10px;height:10px;border-radius:50%;background:var(--peach)}
.bigfig{width:100%;aspect-ratio:200/160;background:#fff;border-radius:22px;display:block}
.musclemap{width:100%;max-width:300px;display:block;margin:0 auto}
.musclemap .mn{fill:#D9CCE0}.musclemap .mp{fill:var(--terra)}.musclemap .ms{fill:var(--peach);opacity:.7}
.musclemap text{font-size:11px;fill:var(--muted);font-family:var(--body);font-weight:600}
.prose p{margin:0 0 10px}
details.faq{background:#fff;border-radius:18px;margin-bottom:8px;box-shadow:0 1px 0 var(--line)}
details.faq summary{list-style:none;padding:14px 44px 14px 16px;font-weight:700;cursor:pointer;position:relative;min-height:48px}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary::after{content:"";position:absolute;right:18px;top:20px;width:9px;height:9px;border-right:2px solid var(--btn);border-bottom:2px solid var(--btn);transform:rotate(45deg);transition:transform .25s var(--ease-out)}
details.faq[open] summary::after{transform:rotate(-135deg)}
details.faq p{padding:0 16px 14px;color:var(--muted)}
.toggle{width:52px;height:32px;border-radius:999px;background:#E2D8E6;position:relative;transition:background .2s;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.15);transition:transform .25s var(--ease-out)}
.toggle.on{background:var(--btn)}.toggle.on::after{transform:translateX(20px)}
.seg{display:flex;background:#fff;border-radius:999px;padding:3px;box-shadow:0 1px 0 var(--line)}
.seg button{flex:1;min-height:38px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted);transition:background .2s,color .2s}
.seg button.on{background:var(--btn);color:#fff}
.potgrid,.decogrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.potopt{background:#fff;border-radius:18px;padding:8px 6px 10px;text-align:center;font-size:12px;font-weight:700;box-shadow:0 1px 0 var(--line);position:relative}
.potopt.on{box-shadow:inset 0 0 0 2.5px var(--accent)}
.potopt.locked{opacity:.55}
.potopt svg{width:100%;aspect-ratio:1;display:block}
.code{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all;background:#fff;border-radius:14px;padding:12px;max-height:140px;overflow:auto;border:1.5px solid var(--line)}
.empty{text-align:center;padding:24px 16px;color:var(--muted)}
.empty svg.ill{width:120px;height:100px;display:block;margin:0 auto 8px}

/* Onboarding */
.onb{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;max-width:480px;margin:0 auto;padding:calc(20px + var(--safe-t)) 20px calc(20px + var(--safe-b))}
.onb .pane{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px}
.onb .dots{display:flex;gap:6px;justify-content:center;margin:12px 0}
.onb .dots i{width:8px;height:8px;border-radius:4px;background:var(--line);transition:background .3s}
.onb .dots i.on{width:24px;background:var(--btn)}
.onb .scene-wrap{border-radius:var(--r-hero);overflow:hidden;max-width:300px;width:100%;margin:0 auto}
.onb h1{font-size:30px}
.onb .lead{font-size:17px;color:var(--muted)}
.rule{display:flex;gap:12px;align-items:flex-start;background:#fff;border-radius:18px;padding:12px 14px;box-shadow:0 1px 0 var(--line)}
.rule .ic-wrap{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}

.rm .fall,.rm .fly,.rm .cl1,.rm .cl2,.rm .butterfly{animation-duration:40s!important}
.rm .star,.rm .flame,.rm .bulb .bglow,.rm .mobile g,.rm .bird,.rm .drop-l{animation:none!important}
@media (min-width:600px){body{background:#F4E9E4}#app{background:var(--bg);box-shadow:0 0 0 1px var(--line)}}

.potthumb{position:relative;width:100%;aspect-ratio:1;display:block}
.potthumb img{position:absolute;left:6%;top:4%;width:88%;height:auto}
.potthumb .pat{position:absolute;left:6%;top:4%;width:88%;aspect-ratio:554/548;-webkit-mask:var(--m) center/100% 100% no-repeat;mask:var(--m) center/100% 100% no-repeat}
.onb .scene-wrap{aspect-ratio:400/430}
@media (max-width:380px){#s-garten .top h1{font-size:25px}#s-garten .top .chip{font-size:12px;padding:0 10px}}

</style>
</head>
<body>
<div id="app">
  <main>
    <section class="screen" id="s-garten" aria-label="Garten"></section>
    <section class="screen" id="s-training" aria-label="Training"></section>
    <section class="screen" id="s-verlauf" aria-label="Verlauf"></section>
    <section class="screen" id="s-erfolge" aria-label="Erfolge"></section>
    <section class="screen" id="s-mehr" aria-label="Mehr"></section>
  </main>
</div>

/* Bloom: Pflanzengenerator und Renderer (Aquarell-SVG, stufenlos) */
const Plant = (() => {

  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));

  const eOut = t => 1 - Math.pow(1 - t, 3);

  function rng(seed) {
    let a = seed >>> 0;
    return () => {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };

  /* Farbpaletten der Blüten je Pflanze */
  const FLOWER_SETS = [

  /* Modell: alle Elemente der ausgewachsenen Pflanze mit Geburtszeitpunkt */
  function makeModel(seed, flowerSet) {
    const r = rng(seed || 1);
    const R = (a, b) => a + (b - a) * r();
    const fset = FLOWER_SETS[(flowerSet ?? Math.floor(r() * FLOWER_SETS.length)) % FLOWER_SETS.length];
    const N = 21, shoots = [];
    const off = r();
    for (let i = 0; i < N; i++) {
      const q = i / (N - 1);
      let u = ((i * .6180339 + off) % 1) * 2 - 1;           // goldener Schnitt verteilt die Richtungen
      if (i < 2) u = i === 0 ? -.55 : .6;
      const maxSpread = lerp(52, 64, q);
      const phi = u * maxSpread * D2R;
      const side = u < 0 ? -1 : 1;
      const dome = Math.pow(Math.cos(phi * .9), .7);
      const len = (110 + 470 * Math.pow(q, .8)) * dome * R(.9, 1.08);
      const leaf = (70 + 120 * Math.pow(q, .55)) * R(.88, 1.1);
      const up = Math.abs(u) < .45;
      const grad = q > .55 ? (up ? (r() < .75 ? 'lgPeach' : 'lgSage') : (r() < .5 ? 'lgLav' : 'lgSage'))
        : (up ? (r() < .5 ? 'lgMint' : 'lgSage') : (r() < .6 ? 'lgLav' : 'lgMint'));
      const s = {
        kind: 'shoot', i,
        birth: i < 2 ? 1.75 + i * .35 : 2.5 + (i - 2) * .44 + R(-.08, .08),
        span: i < 4 ? 1.7 : 2.6,
        side, ang: phi * .82,
        len, leaf, grad,
        bend: side * R(.1, .3) * (.4 + Math.abs(u)),
        tilt: side * lerp(.25, .85, Math.abs(u)) * R(.85, 1.15),
        ox: u * 15 + R(-4, 4),
        shape: 'leaf' + Math.floor(r() * 3),
        skew: R(-9, 9),
        phase: R(0, 6.28),
        mirror: r() < .5 ? -1 : 1,
        extra: null
      };
      if (i >= 9 && r() < .7) {
        s.extra = {
          at: R(.45, .64), birth: s.birth + R(1.0, 1.6), size: leaf * R(.55, .72),
          dir: r() < .5 ? -side : side, tilt: 0, grad: r() < .5 ? 'lgMint' : 'lgSage', shape: 'leaf' + Math.floor(r() * 3), phase: R(0, 6.28)
        };
        s.extra.tilt = s.extra.dir * R(.6, 1.0);
      }
      shoots.push(s);
    }
    // Blütenstiele
    const flowers = [];
    const fb = [8.05, 8.4, 8.8, 9.15, 9.4, 9.65, 9.9, 10.1, 10.3, 10.5, 10.7, 10.85, 11.0, 11.15];
    fb.forEach((b, j) => {
      let u = ((j * .618 + off * .5 + .2) % 1) * 2 - 1;
      const sd = u < 0 ? -1 : 1;
      const n = j < 2 ? 1 : (r() < .5 ? 2 : 3);
      const col = fset[j % 2 === 0 ? 0 : 1];
      const phi = u * 48 * D2R;
      flowers.push({
        kind: 'flower', j, birth: b + R(-.05, .05), side: sd,
        ang: phi * .8, len: (420 + R(0, 150)) * Math.pow(Math.cos(phi), .8), bend: sd * R(.05, .25),
        size: R(52, 66), color: col, ox: u * 10, phase: R(0, 6.28), rot: R(0, 72),
        cluster: Array.from({ length: n - 1 }, (_, k) => ({
          off: (k === 0 ? 1 : -1) * R(.5, .85), len: R(.14, .22), delay: R(.25, .6), size: R(.62, .8),
          color: r() < .7 ? col : fset[(j + 1) % 2], rot: R(0, 72)
        }))
      });
    });
    return { seed, fset, shoots, flowers };
  }

  /* Geometrie-Helfer */
  const dir = a => [Math.sin(a), -Math.cos(a)];
  function cubicPt(p0, p1, p2, p3, t) {
    const u = 1 - t;
    return [u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0],
      u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1]];
  }
  function stemPath(p0, p1, p2, p3, w0, w1) {
    const n = 12, L = [], Rr = [];
    let prev = p0;
    for (let k = 0; k <= n; k++) {
      const t = k / n, p = cubicPt(p0, p1, p2, p3, t);
      const q = cubicPt(p0, p1, p2, p3, Math.min(1, t + .02));
      const q0 = cubicPt(p0, p1, p2, p3, Math.max(0, t - .02));
      let dx = q[0] - q0[0], dy = q[1] - q0[1];
      const m = Math.hypot(dx, dy) || 1; dx /= m; dy /= m;
      const w = lerp(w0, w1, t) / 2;
      L.push([p[0] - dy * w, p[1] + dx * w]); Rr.push([p[0] + dy * w, p[1] - dx * w]);
      prev = p;
    }
    const pts = L.concat(Rr.reverse());
    return 'M' + pts.map(p => f1(p[0]) + ' ' + f1(p[1])).join('L') + 'Z';
  }
  function stemGeo(base, ang, len, bend) {
    const tip = [base[0] + Math.sin(ang) * len, base[1] - Math.cos(ang) * len];
    const a1 = ang * .22;
    const p1 = [base[0] + Math.sin(a1) * len * .42, base[1] - Math.cos(a1) * len * .42];
    const a2 = ang + bend;
    const p2 = [tip[0] - Math.sin(a2) * len * .34, tip[1] + Math.cos(a2) * len * .34];
    return { p0: base, p1, p2, tip, tan: a2 };
  }

  function el(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }

  let viewCount = 0;

  class View {
    constructor(svg, opts = {}) {
      ensureDefs();
      this.svg = svg;
      this.id = ++viewCount;
      this.opts = opts;
      this.g = opts.g ?? 0;
      this.wilt = opts.wilt ?? 0;
      this.model = makeModel(opts.seed ?? 7, opts.flowerSet);
      this.pokeT = -10; this.stretchT = -10; this.pokeAmp = 1;
      this.reduce = !!opts.reduce;
      this.t0 = performance.now();
      this.static = !!opts.static;
      this.build();
      this.render(0);
    }
    build() {
      const s = this.svg;
      s.setAttribute('viewBox', `${VB.x} ${VB.y} ${VB.w} ${VB.h}`);
      s.innerHTML = '';
      const defs = el('defs', {}, s);
      const f = el('filter', { id: 'wf' + this.id, 'color-interpolation-filters': 'sRGB' }, defs);
      this.cm = el('feColorMatrix', { type: 'saturate', values: '1' }, f);
      this.root = el('g', { class: 'plant-root' }, s);
      if (this.opts.potHref) el('image', { href: this.opts.potHref, x: 0, y: 0, width: POT.w, height: POT.h, class: 'pot-img' }, this.root);
      this.wet = el('ellipse', { cx: 276, cy: 68, rx: 196, ry: 24, fill: '#3E2414', opacity: 0 }, this.root);
      this.glow = el('ellipse', { cx: B.x, cy: -180, rx: 360, ry: 380, fill: 'url(#glowG)', opacity: 0 }, this.root);
      this.plantG = el('g', { class: 'plant' }, this.root);
      this.stretchG = el('g', {}, this.plantG);
      const G = this.stretchG;
      this.flowerStalks = el('g', {}, G);
      this.sproutG = el('g', {}, G);
      this.shootLayer = el('g', {}, G);
      this.bloomLayer = el('g', {}, G);
      this.petalLayer = el('g', { 'pointer-events': 'none' }, G);
      // Sprössling
      this.sprout = {
        stem: el('path', { fill: 'url(#stemG)', stroke: '#7E9C7A', 'stroke-opacity': .35, 'stroke-width': 1 }, this.sproutG),
        cL: this.mkUseLeaf(this.sproutG, 'coty', 'lgMint'),
        cR: this.mkUseLeaf(this.sproutG, 'coty', 'lgMint'),
        bud: this.mkUseLeaf(this.sproutG, 'bud', 'lgMint', true)
      };
      // Triebe, die jüngsten (höchsten) hinten
      const order = this.model.shoots.slice().sort((a, b) => b.i - a.i);
      this.shootNodes = order.map(sh => {
        const g = el('g', {}, this.shootLayer);
        const stem = el('path', { fill: 'url(#stemG)', stroke: '#7E9C7A', 'stroke-opacity': .35, 'stroke-width': 1 }, g);
        let ex = null;
        if (sh.extra) {
          ex = { stem: el('path', { fill: 'url(#stemG)', stroke: '#7E9C7A', 'stroke-opacity': .3, 'stroke-width': .8 }, g), leaf: this.mkLeaf(g, sh.extra.shape, sh.extra.grad) };
        }
        const leaf = this.mkLeaf(g, sh.shape, sh.grad);
        return { sh, g, stem, leaf, ex };
      });
      // Blüten
      this.flowerNodes = this.model.flowers.map(fl => {
        const stalk = el('path', { fill: 'url(#stemG)', stroke: '#7E9C7A', 'stroke-opacity': .3, 'stroke-width': .8 }, this.flowerStalks);
        const heads = [{ c: fl.color, size: 1, rot: fl.rot, delay: 0 }].concat(fl.cluster.map(c => ({ c: c.color, size: c.size, rot: c.rot, delay: c.delay, off: c.off, len: c.len })));
        const hs = heads.map(h => {
          const ped = h.off !== undefined ? el('path', { fill: 'url(#stemG)' }, this.flowerStalks) : null;
          return { h, ped, node: this.mkBlossom(this.bloomLayer, h.c) };
        });
        return { fl, stalk, hs };
      });
      // Erdhügel und Kragen
      this.mound = el('g', {}, this.root);
      el('ellipse', { cx: B.x, cy: B.y + 2, rx: 30, ry: 9, fill: 'url(#soilG)' }, this.mound);
      for (let k = 0; k < 9; k++) {
        const a = k / 9 * 6.28; el('circle', { cx: f1(B.x + Math.cos(a) * 18), cy: f1(B.y + 1 + Math.sin(a) * 5), r: 2.2 + (k % 3) * .6, fill: k % 2 ? '#A7744F' : '#6E4224', opacity: .75 }, this.mound);
      }
      el('path', { d: `M${B.x - 16} ${B.y - 1} l7 -3 l4 3 M${B.x + 5} ${B.y - 2} l6 -2 l5 3`, stroke: '#5E3A22', 'stroke-width': 1.6, fill: 'none', 'stroke-linecap': 'round', opacity: .7 }, this.mound);
      this.collar = el('ellipse', { cx: B.x + 2, cy: B.y + 6, rx: 20, ry: 4.5, fill: '#8D582F', opacity: .9 }, this.root);
      // schwebende Blütenblätter
      this.petals = Array.from({ length: 6 }, (_, k) => ({ k, node: el('use', { href: '#petal', fill: `url(#pg-${this.model.fset[k % 2]})`, opacity: 0 }, this.petalLayer), t: k * 1.7 }));
      if (this.opts.onTap) {
        const hit = el('rect', { x: -40, y: -650, width: 640, height: 760, fill: 'transparent', class: 'plant-hit' }, s);
        hit.addEventListener('click', e => this.opts.onTap(e));
      }
    }
    mkLeaf(parent, shape, grad) {
      const g = el('g', {}, parent);
      el('use', { href: '#' + shape, fill: `url(#${grad})` }, g);
      el('use', { href: '#leafPool', fill: '#4F6E55', opacity: .14 }, g);
      el('use', { href: '#leafWash', fill: '#fff', opacity: .2 }, g);
      el('use', { href: '#leafVein', fill: 'none', stroke: '#F3F7EC', 'stroke-width': .016, opacity: .45, 'stroke-linecap': 'round' }, g);
      el('use', { href: '#' + shape, fill: 'none', stroke: '#55735A', 'stroke-width': .022, opacity: .42 }, g);
      return g;
    }
    mkUseLeaf(parent, shape, grad, bud) {
      const g = el('g', {}, parent);
      el('use', { href: '#' + shape, fill: `url(#${grad})` }, g);
      el('use', { href: '#' + shape, fill: 'none', stroke: '#5F7D62', 'stroke-width': .03, opacity: .35 }, g);
      if (!bud) el('path', { d: 'M0 -.05 L0 -.8', stroke: '#EEF5E8', 'stroke-width': .04, opacity: .5 }, g);
      return g;
    }
    mkBlossom(parent, c) {
      const g = el('g', {}, parent);
      const bud = el('g', {}, g);
      el('use', { href: '#sepal', fill: '#8FAE88', transform: 'rotate(-28) scale(.9)' }, bud);
      el('use', { href: '#sepal', fill: '#8FAE88', transform: 'rotate(28) scale(.9) scale(-1 1)' }, bud);
      el('use', { href: '#bud', fill: `url(#bg-${c})`, transform: 'scale(.95 1.15)' }, bud);
      el('use', { href: '#bud', fill: 'none', stroke: FLOWER[c].edge, 'stroke-width': .03, opacity: .4, transform: 'scale(.95 1.15)' }, bud);
      el('use', { href: '#sepal', fill: '#9DBA94', opacity: .9, transform: 'scale(.7)' }, bud);
      const open = el('g', {}, g);
      const petals = [];
      for (let k = 0; k < 5; k++) {
        const pg = el('g', {}, open);
        el('use', { href: '#petal', fill: `url(#pg-${c})` }, pg);
        el('use', { href: '#petal', fill: 'none', stroke: FLOWER[c].edge, 'stroke-width': .022, opacity: .38 }, pg);
        el('path', { d: 'M0 -.08 C.02 -.3 .03 -.5 0 -.7', stroke: '#fff', 'stroke-width': .03, opacity: .35, fill: 'none' }, pg);
        petals.push(pg);
      }
      const ctr = el('g', {}, open);
      el('circle', { r: .2, fill: '#F3D9A0' }, ctr);
      el('circle', { r: .2, fill: 'none', stroke: '#D9A25E', 'stroke-width': .03, opacity: .6 }, ctr);
      for (let k = 0; k < 7; k++) { const a = k / 7 * 6.28; el('circle', { cx: f1(Math.cos(a) * .12 * 10) / 10, cy: f1(Math.sin(a) * .12 * 10) / 10, r: .04, fill: '#C9734F', opacity: .8 }, ctr); }
      return { g, bud, open, petals, ctr };
    }

    /* Interaktionen */
    poke(amp = 1) { this.pokeT = this.now(); this.pokeAmp = amp; }
    stretch() { this.stretchT = this.now(); }
    now() { return (performance.now() - this.t0) / 1000; }
    soilPoint() { return { x: B.x, y: B.y }; }
    topPoint() { const g = this.g; return { x: B.x, y: B.y - Math.min(520, 60 + g * 48) }; }
    setG(g) { this.g = g; }
    setWilt(w) { this.wilt = w; }

    render(time) {
      const t = time ?? this.now();
      const g = this.g, w = this.wilt, R = this.reduce ? .3 : 1;
      const stat = this.static;
      if (this.opts.camera !== false) {
        const z = lerp(1.3, 1, sstep(clamp((g - .3) / 7.5)));
        const vw = VB.w / z, vh = VB.h / z;
        const vb = `${f1(277 - vw / 2)} ${f1(VB.y + VB.h - vh)} ${f1(vw)} ${f1(vh)}`;
        if (vb !== this._vb) { this.svg.setAttribute('viewBox', vb); this._vb = vb; }
      }
      // Wind
      const wind = stat || this.reduce ? 0 : (Math.sin(t * .85) * .6 + Math.sin(t * 1.63 + 1.1) * .3 + Math.sin(t * .31 + 2) * .45) * R;
      const pk = stat ? 0 : Math.max(0, t - this.pokeT);
      const pokeE = pk < 3 ? Math.exp(-pk * 2.1) * this.pokeAmp * (this.reduce ? .4 : 1) : 0;
      const st = stat ? 9 : t - this.stretchT;
      const stretch = st < 2.5 ? Math.exp(-st * 2.6) * Math.sin(st * 9.5) * .05 * (this.reduce ? .4 : 1) : 0;
      this.stretchG.setAttribute('transform', `translate(${B.x} ${B.y}) scale(${f1((1 - stretch * .35) * 1000) / 1000} ${f1((1 + stretch) * 1000) / 1000}) translate(${-B.x} ${-B.y})`);
      // Welken über Farbmatrix
      if (w > .01) {
        this.cm.setAttribute('values', (1 - .55 * w).toFixed(3));
        this.plantG.setAttribute('filter', `url(#wf${this.id})`);
      } else this.plantG.removeAttribute('filter');
      this.plantG.setAttribute('opacity', (1 - .1 * w).toFixed(3));

      // Sprössling + Keimblätter
      const sp = clamp((g + .35) / 1.9);
      const spStem = (18 + 62 * eOut(sp) + 34 * clamp((g - 1.6) / 2.6)) * (1 - .25 * w);
      const spFade = 1 - clamp((g - 4.6) / 1.6);
      const spAng = (wind * .9 + pokeE * Math.sin(pk * 9) * 5) * D2R + w * .5;
      const sg = stemGeo([B.x - 2, B.y + 4], spAng, spStem, .14 + w * .6);
      this.sprout.stem.setAttribute('d', stemPath(sg.p0, sg.p1, sg.p2, sg.tip, 11, 6.5));
      this.sproutG.setAttribute('opacity', spFade.toFixed(3));
      this.sproutG.style.display = spFade <= 0 ? 'none' : '';
      const open = eInOut(clamp((g - .62) / .55));
      const cs = 24 + 40 * eOut(clamp(g / 1.8)) + 10 * clamp((g - 2.2) / 2);
      const tipDeg = sg.tan / D2R;
      const cAng = lerp(8, 64, open) + w * 30;
      const flut = stat ? 0 : Math.sin(t * 2.2) * 2 * R;
      this.sprout.cL.setAttribute('transform', `translate(${f1(sg.tip[0])} ${f1(sg.tip[1])}) rotate(${f1(tipDeg - cAng + flut)}) scale(${f1(cs * lerp(.45, .62, open))} ${f1(cs)})`);
      this.sprout.cR.setAttribute('transform', `translate(${f1(sg.tip[0])} ${f1(sg.tip[1])}) rotate(${f1(tipDeg + cAng - flut)}) scale(${f1(-cs * lerp(.45, .62, open))} ${f1(cs)})`);
      this.sprout.cL.setAttribute('opacity', open > .02 ? 1 : 0);
      this.sprout.cR.setAttribute('opacity', open > .02 ? 1 : 0);
      const budS = (20 + 18 * sp) * (1 - open);
      this.sprout.bud.setAttribute('transform', `translate(${f1(sg.tip[0])} ${f1(sg.tip[1])}) rotate(${f1(tipDeg + 4)}) scale(${f1(budS * .7)} ${f1(budS)})`);
      this.sprout.bud.setAttribute('opacity', (1 - open).toFixed(3));
      this.mound.setAttribute('opacity', (1 - clamp((g - 1.2) / 1.6)).toFixed(3));
      this.collar.setAttribute('opacity', (.9 * clamp((g - 1.6) / 1)).toFixed(3));

      // Triebe
      for (const n of this.shootNodes) {
        const sh = n.sh;
        const p = clamp((g - sh.birth) / sh.span);
        if (p <= 0) { n.g.style.display = 'none'; continue; }
        n.g.style.display = '';
        const gr = eOut(p);
        const unf = eInOut(clamp((p - .12) / .62));
        const swayA = (wind * (.9 + sh.len / 420) + Math.sin(t * 1.1 + sh.phase) * .35 * R) * D2R * (stat || this.reduce ? 0 : 1);
        const pokeA = pokeE * Math.sin(pk * 9 + sh.phase * .4) * 6 * D2R;
        const ang = sh.ang + swayA + pokeA + sh.side * w * (12 + sh.len / 25) * D2R;
        const len = sh.len * gr * (1 - .1 * w);
        const bend = sh.bend * (.4 + .6 * gr) + sh.side * w * (.5 + sh.len / 600);
        const base = [B.x + sh.ox, B.y + 5];
        const geo = stemGeo(base, ang, len, bend);
        const wB = lerp(3, 7 + sh.len / 110, gr), wT = lerp(2, 3.6 + sh.len / 260, gr);
        n.stem.setAttribute('d', stemPath(geo.p0, geo.p1, geo.p2, geo.tip, wB, wT));
        const lflut = stat || this.reduce ? 0 : Math.sin(t * 2.0 + sh.phase) * 1.8 * R;
        const tilt = sh.tilt * unf + sh.side * w * 1.05;
        const la = (geo.tan + tilt) / D2R + lflut;
        const ls = sh.leaf * (.2 + .8 * eOut(clamp((p - .05) / .8))) * (1 - .08 * w);
        const sx = ls * lerp(.26, 1, unf) * (1 - .18 * w) * sh.mirror;
        n.leaf.setAttribute('transform', `translate(${f1(geo.tip[0])} ${f1(geo.tip[1])}) rotate(${f1(la)}) skewX(${f1(sh.skew)}) scale(${f1(sx)} ${f1(ls)})`);
        if (n.ex) {
          const e = sh.extra, pe = clamp((g - e.birth) / 2.2);
          if (pe <= 0) { n.ex.stem.style.display = n.ex.leaf.style.display = 'none'; }
          else {
            n.ex.stem.style.display = n.ex.leaf.style.display = '';
            const at = cubicPt(geo.p0, geo.p1, geo.p2, geo.tip, e.at);
            const ue = eInOut(clamp((pe - .1) / .6));
            const ea = ang + e.dir * lerp(.25, .9, ue) + e.dir * w * .4 + (stat ? 0 : Math.sin(t * 1.3 + e.phase) * .02);
            const el2 = e.size * .55 * eOut(pe);
            const eg = stemGeo(at, ea, el2, e.dir * .2);
            n.ex.stem.setAttribute('d', stemPath(eg.p0, eg.p1, eg.p2, eg.tip, 3.6, 2.4));
            const es = e.size * (.2 + .8 * eOut(pe));
            const ela = (eg.tan + e.tilt * ue + e.dir * w * .9) / D2R + (stat ? 0 : Math.sin(t * 2.3 + e.phase) * 2 * R);
            n.ex.leaf.setAttribute('transform', `translate(${f1(eg.tip[0])} ${f1(eg.tip[1])}) rotate(${f1(ela)}) scale(${f1(es * lerp(.3, 1, ue))} ${f1(es)})`);
          }
        }
      }

      // Blüten
      let anyOpen = false;
      for (const fnode of this.flowerNodes) {
        const fl = fnode.fl;
        const fp = g - fl.birth;
        if (fp <= 0) { fnode.stalk.style.display = 'none'; fnode.hs.forEach(h => { h.node.g.style.display = 'none'; if (h.ped) h.ped.style.display = 'none'; }); continue; }
        fnode.stalk.style.display = '';
        const gr = eOut(clamp(fp / 1.1));
        const swayA = stat ? 0 : (wind * (1.2 + fl.len / 400) + Math.sin(t * .9 + fl.phase) * .4 * R) * D2R;
        const pokeA = pokeE * Math.sin(pk * 8 + fl.phase) * 7 * D2R;
        const ang = fl.ang + swayA + pokeA + fl.side * w * 22 * D2R;
        const len = fl.len * gr * (1 - .12 * w);
        const geo = stemGeo([B.x + fl.ox, B.y + 5], ang, len, fl.bend + fl.side * w * .9);
        fnode.stalk.setAttribute('d', stemPath(geo.p0, geo.p1, geo.p2, geo.tip, lerp(2.5, 5, gr), lerp(1.6, 2.6, gr)));
        fnode.hs.forEach((h, k) => {
          const hp = fp - h.h.delay;
          if (hp <= 0) { h.node.g.style.display = 'none'; if (h.ped) h.ped.style.display = 'none'; return; }
          h.node.g.style.display = '';
          let pos = geo.tip, tan = geo.tan;
          if (h.ped) {
            h.ped.style.display = '';
            const pg = stemGeo(cubicPt(geo.p0, geo.p1, geo.p2, geo.tip, .93), geo.tan + h.h.off, fl.len * h.h.len * eOut(clamp(hp / .8)), h.h.off * .3);
            h.ped.setAttribute('d', stemPath(pg.p0, pg.p1, pg.p2, pg.tip, 2.4, 1.6));
            pos = pg.tip; tan = pg.tan;
          }
          const budP = eOut(clamp(hp / .9));
          const op = eInOut(clamp((hp - 1) / .9));
          if (op > .05) anyOpen = true;
          const S = fl.size * h.h.size * (1 - .12 * w);
          const nd = h.node;
          nd.bud.setAttribute('opacity', (1 - clamp((op - .25) / .5)).toFixed(3));
          nd.open.style.display = op > .01 ? '' : 'none';
          nd.petals.forEach((pp, i) => {
            const a = h.h.rot + i * 72 + (1 - op) * 12;
            pp.setAttribute('transform', `rotate(${f1(a)}) scale(${(lerp(.25, 1, op) * (1 - w * .15)).toFixed(3)} ${lerp(.35, 1, op).toFixed(3)})`);
          });
          nd.ctr.setAttribute('transform', `scale(${lerp(.3, 1, op).toFixed(3)})`);
          const face = tan / D2R * .35 + (w * fl.side * 35);
          nd.g.setAttribute('transform', `translate(${f1(pos[0])} ${f1(pos[1])}) rotate(${f1(face)}) scale(${f1(S)} ${f1(S * lerp(1, .84, op))})`);
          nd.bud.setAttribute('transform', `translate(0 ${f1(.1 * op)}) scale(${(.6 * budP * (1 + .3 * op)).toFixed(3)})`);
        });
      }

      // schwebende Blütenblätter ab voller Blüte
      const pf = clamp((g - 10.6) / .6) * (1 - w) * (this.reduce ? .4 : 1);
      this.petalLayer.style.display = pf > 0 && !stat ? '' : 'none';
      if (pf > 0 && !stat) {
        for (const pt of this.petals) {
          const T = 7.5, ph = ((t + pt.t) % T) / T;

  }
  function replaceAll(obj) { S = Object.assign(fresh(), obj, { run: null, pendingWater: null }); save(true); }
  function reset() { S = fresh(); save(true); }

  return {
    get, save, KEY, storageOk: () => storageOk, loadError: () => loadError, readyToIncrease,
    dkey, wkey, weekStart, isHoliday, DAY,
    sessions, sessVol, annotate, totalPoints, plantPoints, activePlant, plantStage, wiltNow, daysSince, lastActivity,
    weekInfo, streaks, recommend, exName, exHistory, curWeight, suggestion, best, stats, checkAchievements,
    exportCode, importCode, replaceAll, reset

})();

  function frameAt(spec, time) {
    const seq = spec.seq, n = seq.length, seg = 1.05;
    const holds = spec.hold || seq.map(() => .2);
    const total = seq.reduce((s, _, i) => s + seg + holds[i], 0);
    let t = time % total;
    for (let i = 0; i < n; i++) {
      if (t < holds[i]) return spec.f[seq[i]];
      t -= holds[i];
      if (t < seg) return blend(spec.f[seq[i]], spec.f[seq[(i + 1) % n]], eio(t / seg));

    const k = side(po);
    return ground + spec.props(k) + drawSide(k);
  }

  /* Abspieler: eine Schleife für alle sichtbaren Figuren */
  const live = new Set();
  let raf = 0, t0 = performance.now();
  function loop(now) {
    raf = 0;
    const t = (now - t0) / 1000;
    live.forEach(o => { if (!o.el.isConnected) { live.delete(o); return; } if (o.vis) o.el.innerHTML = svgFor(o.id, t * o.speed + o.off); });

    svg.setAttribute('viewBox', '0 0 200 160');

    svg._fig = o;
    svg.innerHTML = svgFor(id, opts.still ?? 0);
    if (opts.still !== undefined) return;
    live.add(o); if (io) io.observe(svg);
    if (!raf) raf = requestAnimationFrame(loop);
  }
  return { mount, svgFor, LIB };
})();

    const r = Plant.rng(hash(a.id)), c = RC[a.rar];
    const blob = n => { let d = ''; for (let i = 0; i <= n; i++) { const t = i / n * Math.PI * 2, rr = 40 + (r() - .5) * 5; d += (i ? 'L' : 'M') + (50 + Math.cos(t) * rr).toFixed(1) + ' ' + (50 + Math.sin(t) * rr).toFixed(1); } return d + 'Z'; };

      <defs><radialGradient id="${uid}" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="${soft}"/><stop offset=".7" stop-color="${fill}"/><stop offset="1" stop-color="${fill}"/></radialGradient></defs>
      ${a.rar === 'l' && unlocked ? Array.from({ length: 8 }, (_, i) => { const t = i / 8 * 6.28; return `<path transform="translate(${(50 + Math.cos(t) * 46).toFixed(1)} ${(50 + Math.sin(t) * 46).toFixed(1)}) scale(.5)" d="M0 -8l2 6 6 2-6 2-2 6-2-6-6-2 6-2z" fill="#E9A58A"/>`; }).join('') : ''}
      <path d="${blob(18)}" fill="url(#${uid})" opacity="${unlocked ? .95 : 1}"/>
      <path d="${blob(14)}" fill="none" stroke="${unlocked ? c[2] : '#CFC3D3'}" stroke-width="1.2" opacity=".22" transform="translate(50 50) scale(.9) translate(-50 -50)"/>
      <circle cx="50" cy="50" r="26" fill="#fff" opacity="${unlocked ? .55 : .7}"/>
      <path d="M32 30c6-6 14-8 20-7" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".55" fill="none"/>
      <g transform="translate(36 36) scale(1.17)" fill="none" stroke="${unlocked ? c[2] : '#A99BAE'}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="${ICON[icon]}"/></g>

  }

  /* Feierkarte */
  let chain = Promise.resolve();
  function queue(fn) { chain = chain.then(fn).catch(e => console.error(e)); return chain; }

    return new Promise(res => {
      const w = document.createElement('div'); w.className = 'celebrate';
      w.innerHTML = `<div class="cel-card" role="dialog" aria-modal="true"><div class="shine"></div>${html}<div style="margin-top:16px" class="row"><button class="btn block" data-ok>${opts.ok || 'Schön!'}</button></div></div>`;
      document.body.appendChild(w);
      const card = w.querySelector('.cel-card');
      opts.mount && opts.mount(card);
      const R = FX.reduced();
      gsap.to(w, { opacity: 1, duration: .25 });
      gsap.fromTo(card, { scale: .9, y: 24, opacity: 0 }, { scale: 1, y: 0, opacity: 1, duration: R ? .25 : .6, ease: R ? 'power2.out' : 'back.out(1.6)' });
      const big = card.querySelector('.badgebig, .celart');
      if (big && !R) gsap.fromTo(big, { scale: .6, rotation: -14 }, { scale: 1, rotation: 0, duration: .9, ease: 'elastic.out(1,.5)', delay: .1 });
      if (opts.shine && !R) gsap.fromTo(card.querySelector('.shine'), { rotation: 0, opacity: .55 }, { rotation: 360, opacity: 0, duration: 2.2, ease: 'power1.out' });
      const rc = card.getBoundingClientRect();
      if (opts.petals !== false) setTimeout(() => FX.petals(rc.left + rc.width / 2, rc.top + 90, opts.n || 26), 150);
      const ok = w.querySelector('[data-ok]'); ok.focus();
      const close = () => { gsap.to(card, { scale: .96, opacity: 0, duration: .2, ease: 'power2.in' }); gsap.to(w, { opacity: 0, duration: .25, delay: .05, onComplete: () => { w.remove(); res(); } }); };
      ok.addEventListener('click', close);
      w.addEventListener('click', e => { if (e.target === w) close(); });
    });
  }
  function achCard(a) {
    FX.play('ach'); FX.buzz([20, 40, 20]);
    return celebrate(`${badge(a, true, 150).replace('<svg ', '<svg class="badgebig" ')}<div class="rar"><span class="tag ${a.rar === 'c' ? 'mint' : a.rar === 'r' ? 'sky' : a.rar === 'l' ? 'peach' : ''}">${DATA.RAR[a.rar]}</span></div><p class="small muted">Neues Abzeichen</p><h2>${a.name}</h2><p class="muted">${a.desc}</p>`, { shine: a.rar === 'e' || a.rar === 'l', n: a.rar === 'l' ? 44 : 26 });
  }
  async function achBatch(list) {
    if (!list.length) return;
    const head = list.slice(0, 2), rest = list.slice(2);

    }
  }
  return { sheet, dialog, prompt, toast, badge, celebrate, achCard, achBatch, queue, RC, closeAll };
})();

const STAGE_TXT = ['Eine kleine Knospe bricht durch die Erde.', 'Zwei Keimblätter öffnen sich.', 'Die ersten echten Blätter sind da.', 'Sie wird zur kleinen Jungpflanze.', 'Neue Triebe wachsen aus der Mitte.', 'Blätter in Mint und Lavendel.', 'Deine Pflanze wird richtig buschig.', 'Groß und kräftig, mit eigenen Ästen.', 'Die ersten Knospen zeigen sich.', 'Die erste Blüte öffnet sich.', 'Sie steht in voller Blüte.', 'Eine Prachtpflanze. Genau wie deine Ausdauer.'];

function weekStrip() {
  const ws = Store.weekStart(Date.now()), today = Store.dkey(Date.now()), list = Store.sessions();
  return `<div class="row" style="justify-content:space-between">${Array.from({ length: 7 }, (_, i) => {
    const d = new Date(ws); d.setDate(d.getDate() + i); const k = Store.dkey(d);
    const s = list.filter(x => Store.dkey(x.end) === k).pop();
    const col = s ? (s.wid === 'LA' ? 'var(--peach)' : s.wid === 'LB' ? 'var(--mint)' : '#B9A3D6') : '#fff';
    return `<div style="text-align:center;flex:1"><div class="small muted" style="font-weight:700">${DOW[d.getDay()]}</div><div style="margin:4px auto 0;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:${col};${k === today ? 'box-shadow:inset 0 0 0 2px var(--ink);' : 'box-shadow:0 1px 0 var(--line);'}font-weight:800;font-size:14px">${s ? ic('drop', 'sm') : d.getDate()}</div></div>`;
  }).join('')}</div>`;
}
function renderTraining() {
  const el = $('#s-training'), rec = Store.recommend(), wi = Store.weekInfo();
  const card = id => {
    const w = DATA.WORKOUTS[id];
    return `<div class="wcard ${w.color}">${rec.wid === id ? '<span class="tag peach rec">Empfohlen</span>' : ''}
      <h2>${w.name}${w.variant ? ` <span class="tag">${w.variant}</span>` : ''}</h2>
      <p class="small muted" style="margin-top:4px">${w.note ? w.note + ' · ' : ''}etwa ${estMin(id)} min</p>
      <ul class="exl">${w.ex.map(x => { const e = DATA.EX[x]; const cw = Store.curWeight(x); return `<li><button class="row" data-ex="${x}" style="text-align:left;gap:6px">${esc(Store.exName(x))}${e.key ? ' <span class="tag">wichtig</span>' : ''}</button><span class="muted num">${e.sets} × ${e.reps}${e.perSide ? ' je Seite' : ''}${cw ? ' · ' + kg(cw) : ''}</span></li>`; }).join('')}
      ${w.abs ? `<li><button class="row" data-abs style="text-align:left">Abs Zirkel</button><span class="muted">9 × 30 s ohne Pause</span></li>` : ''}</ul>
      <button class="btn block" data-start="${id}">${ic('play', 'sm')} Starten</button></div>`;
  };
  const group = (g, t) => `<h3 style="margin:18px 2px 10px">${t}</h3><div class="exgrid">${Object.values(DATA.EX).filter(e => e.group === g).map(e => `<button class="extile" data-ex="${e.id}"><svg class="fig" data-fig="${e.id}"></svg><div class="t">${esc(Store.exName(e.id))}</div><div class="s">${e.time ? e.time + ' s' : `${e.sets} × ${e.reps}${e.perSide ? ' je Seite' : ''}`}${S().guides[e.id] ? ' · gelesen' : ''}</div></button>`).join('')}</div>`;
  el.innerHTML = `<div class="top"><div><h1>Training</h1><div class="sub">${wi.count >= 3 ? 'Wochenziel geschafft' : `Noch ${3 - wi.count} ${3 - wi.count === 1 ? 'Einheit' : 'Einheiten'} bis zum Wochenziel`}</div></div></div>
    <div class="card" style="margin-bottom:12px">${weekStrip()}<p class="small muted" style="margin-top:10px">Plan: 2× Beine & Po mit Abs, 1× Arme & Rücken. Die Tage wählst du frei.</p></div>
    <div class="stack">${[rec.wid, ...['LA', 'LB', 'AR'].filter(x => x !== rec.wid)].map(card).join('')}</div>
    <div id="lib">${group('legs', 'Beine & Po')}${group('abs', 'Abs Zirkel')}${group('upper', 'Arme & Rücken')}</div>
    <button class="btn ghost block" id="upperHint" style="margin-top:16px">${ic('info', 'sm')} Hinweis zum Oberkörper</button>`;
  $$('[data-start]', el).forEach(b => b.onclick = () => startWorkout(b.dataset.start));
  $$('[data-ex]', el).forEach(b => b.onclick = () => exerciseSheet(b.dataset.ex));
  $$('[data-abs]', el).forEach(b => b.onclick = () => exerciseSheet('cycleR'));
  $$('svg[data-fig]', el).forEach((s, i) => Figure.mount(s, s.dataset.fig, { off: i * .37 }));
  $('#upperHint').onclick = () => wissenSheet('upper');
}

async function startWorkout(wid) {
  const st = S();
  if (st.run) {
    const v = await UI.dialog('Training läuft noch', `Du hast ${DATA.WORKOUTS[st.run.wid].name} noch offen. Fortsetzen oder neu starten?`, [{ l: 'Neu starten', v: 'new', danger: true }, { l: 'Fortsetzen', v: 'resume', primary: true }]);
    if (v === 'resume') return Player.open();
    if (v !== 'new') return;
  }
  const w = DATA.WORKOUTS[wid];
  st.run = {
    wid, start: Date.now(), idx: 0, phase: 'ex',
    ex: w.ex.map(id => {
      const e = DATA.EX[id], sg = Store.suggestion(id), cw = Store.curWeight(id);
      const last = Store.exHistory(id).slice(-1)[0];
      const w0 = sg ? sg.to : cw;
      return { id, sub: null, label: id === 'band' ? (st.bandLabel || '') : '', perSide: !!e.perSide, skipped: false, sugg: sg, sets: Array.from({ length: e.sets }, (_, i) => ({ w: e.free ? null : (w0 ?? null), r: sg ? 8 : ((last && last.e.sets[i] && last.e.sets[i].r) || e.reps), done: false, side: 0 })) };
    }),
    abs: w.abs ? { on: true, i: 0, left: 30, state: 'idle', clean: true, done: 0, total: DATA.ABS.length, endAt: 0 } : { on: false, i: 0, left: 30, state: 'idle', clean: true, done: 0, total: DATA.ABS.length, endAt: 0 },
    feel: null, note: '', restEnd: 0, restTotal: 0
  };
  Store.save();
  Player.open();
}

/* ---------- Spieler ---------- */
const Player = (() => {
  let el = null, clock = 0, restEl = null;
  const run = () => S().run;
  function steps() { const r = run(); return r.ex.length + (r.abs.on ? 1 : 0); }
  function open() {
    if (!run()) return;
    if (!el) { el = document.createElement('div'); el.className = 'player'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', 'Training'); document.body.appendChild(el); }
    lock();
    document.body.style.overflow = 'hidden';
    if (!FX.reduced()) gsap.fromTo(el, { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: .38, ease: 'expo.out' });
    render();
    clearInterval(clock); clock = setInterval(tick, 250);
  }
  let wl = null;
  async function lock() { try { if ('wakeLock' in navigator && !wl) { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => wl = null); } } catch (e) { wl = null; } }
  document.addEventListener('visibilitychange', () => { if (!document.hidden && el) { lock(); tick(); } });
  function close() {
    try { wl && wl.release(); } catch (e) { } wl = null;
    clearInterval(clock); hideRest(true);
    if (el) { const e = el; el = null; gsap.to(e, { y: 30, opacity: 0, duration: .25, ease: 'power2.in', onComplete: () => e.remove() }); }
    document.body.style.overflow = '';
  }
  function head(title) {
    const r = run(), n = steps(), cur = r.phase === 'finish' ? n : r.phase === 'abs' ? r.ex.length : r.idx;
    return `<div class="pl-top"><button class="iconbtn" data-x aria-label="Training verlassen">${ic('x')}</button><div class="ttl">${title}</div><div class="time num" id="plTime">${fdur((Date.now() - r.start) / 1000)}</div></div>
      <div class="pl-prog">${Array.from({ length: n }, (_, i) => `<i class="${i < cur ? 'done' : i === cur ? 'cur' : ''}"></i>`).join('')}</div>`;
  }
  function render() {
    const r = run(); if (!r || !el) return;
    if (r.phase === 'ex') renderEx();
    else if (r.phase === 'abs') renderAbs();
    else renderFinish();
    el.querySelector('[data-x]').onclick = leave;
  }
  async function leave() {
    const v = await UI.dialog('Training verlassen?', 'Du kannst später genau hier weitermachen. Oder das Training verwerfen, dann wird nichts gespeichert.', [{ l: 'Verwerfen', v: 'drop', danger: true }, { l: 'Später weiter', v: 'pause' }, { l: 'Bleiben', v: null, primary: true }]);
    if (v === 'pause') { close(); route(); }
    if (v === 'drop') { const ok = await UI.dialog('Wirklich verwerfen?', 'Die Einträge dieser Einheit gehen verloren.', [{ l: 'Abbrechen', v: false }, { l: 'Verwerfen', v: true, primary: true }]); if (ok) { S().run = null; Store.save(); close(); route(); } }
  }
  function exTitle(e) { return e.sub ? esc(e.sub) : (e.id === 'band' && e.label ? esc(e.label) : esc(Store.exName(e.id))); }
  function renderEx() {
    const r = run(), e = r.ex[r.idx], X = DATA.EX[e.id];
    const doneAll = e.sets.every(s => s.done);
    const curSet = e.sets.findIndex(s => !s.done);
    const next = r.ex[r.idx + 1];
    const nextLabel = next ? exTitle(next) : r.abs.on ? 'Abs Zirkel' : 'Abschluss';
    const unit = X.free ? '' : 'kg';
    el.innerHTML = head(DATA.WORKOUTS[r.wid].name + (DATA.WORKOUTS[r.wid].variant ? ' ' + DATA.WORKOUTS[r.wid].variant : '')) + `
      <div class="pl-body">
        <div class="exhead"><svg class="fig" id="plFig"></svg><div><h2>${exTitle(e)}</h2><div class="target">${X.sets} × ${X.reps}${e.perSide ? ' je Seite' : ''}${X.weight != null && !e.sub ? ' · Plan ' + kg(X.weight) : ''}</div><div class="exnote">${X.key && !e.sub ? '<span class="tag peach">Wichtigste Übung</span>' : ''}<span class="tag mint">${X.cue}</span></div></div></div>
        ${e.sugg && !e.sub ? `<div class="sugg">${ic('up')} <span>Letztes Mal 12 in allen Sätzen. Vorschlag: ${kg(e.sugg.to)} statt ${kg(e.sugg.from)}.</span></div>` : ''}
        ${e.id === 'band' ? `<input type="text" id="bandLabel" placeholder="Welche Bandübung? Zum Beispiel Monster Walks" value="${esc(e.label)}" style="margin-bottom:10px" aria-label="Name der Bandübung">` : ''}
        <div class="sethead"><span>Satz</span><span>${X.free ? '' : 'Gewicht (kg)'}</span><span>Wiederholungen</span><span></span></div>
        ${e.sets.map((s, i) => `<div class="setrow ${s.done ? 'done' : i === curSet ? 'cur' : ''}" data-i="${i}">
            <div class="n">${i + 1}</div>
            ${X.free ? `<div class="small muted" style="font-weight:700;text-align:center">Band</div>` : `<div class="step"><button data-w="-1" aria-label="Gewicht weniger">${ic('minus', 'sm')}</button><input inputmode="decimal" data-wi value="${s.w ?? ''}" placeholder="kg" aria-label="Gewicht Satz ${i + 1}"><button data-w="1" aria-label="Gewicht mehr">${ic('plus', 'sm')}</button></div>`}
            <div class="step"><button data-r="-1" aria-label="Wiederholungen weniger">${ic('minus', 'sm')}</button><input inputmode="numeric" data-ri value="${s.r ?? ''}" aria-label="Wiederholungen Satz ${i + 1}"><button data-r="1" aria-label="Wiederholungen mehr">${ic('plus', 'sm')}</button></div>
            <button class="ok" data-ok aria-label="Satz ${i + 1} erledigt">${ic('check')}</button>
            ${e.perSide ? `<div></div><div class="sides"><span class="${s.side >= 1 || s.done ? 'sd-ok' : i === curSet ? 'sd-on' : ''}">Links</span><span class="${s.done ? 'sd-ok' : s.side === 1 && i === curSet ? 'sd-on' : ''}">Rechts</span></div>` : ''}
          </div>`).join('')}
        <div class="row wrap" style="margin-top:6px"><button class="btn sm ghost" data-guide>${ic('book', 'sm')} Anleitung</button><button class="btn sm ghost" data-swap>${ic('swap', 'sm')} Ersetzen</button><button class="btn sm ghost" data-skip>${ic('skip', 'sm')} Überspringen</button></div>
        <p class="small muted" style="margin-top:12px">${X.breath}</p>
      </div>
      <div class="pl-foot">${r.idx > 0 ? `<button class="btn white" data-prev aria-label="Vorherige Übung">${ic('chevL', 'sm')}</button>` : ''}<button class="btn ${doneAll ? '' : 'soft'} grow" data-next><span class="ell">${doneAll ? 'Weiter: ' : 'Als Nächstes: '}${nextLabel}</span> ${ic('chevR', 'sm')}</button></div>`;
    Figure.mount($('#plFig', el), e.id);
    const X2 = X;
    $$('.setrow', el).forEach(row => {
      const i = +row.dataset.i, s = e.sets[i];
      row.querySelectorAll('[data-w]').forEach(b => b.onclick = () => { const step = X2.inc >= 2 ? 2.5 : 1; s.w = Math.max(0, Math.round(((+s.w || 0) + step * +b.dataset.w) * 10) / 10); row.querySelector('[data-wi]').value = s.w; Store.save(); FX.play('tap'); });
      row.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { s.r = Math.max(0, (+s.r || 0) + +b.dataset.r); row.querySelector('[data-ri]').value = s.r; Store.save(); FX.play('tap'); });
      const wi = row.querySelector('[data-wi]'); if (wi) wi.onchange = () => { const v = parseFloat(String(wi.value).replace(',', '.')); s.w = isNaN(v) ? null : v; Store.save(); };
      const ri = row.querySelector('[data-ri]'); ri.onchange = () => { const v = parseInt(ri.value); s.r = isNaN(v) ? null : v; Store.save(); };
      row.querySelector('[data-ok]').onclick = (ev) => completeSet(i, ev.currentTarget);
    });
    const bl = $('#bandLabel', el); if (bl) bl.oninput = () => { e.label = bl.value; S().bandLabel = bl.value; Store.save(); };
    $('[data-next]', el).onclick = nextEx;
    $('[data-prev]', el) && ($('[data-prev]', el).onclick = () => { r.idx--; Store.save(); hideRest(); render(); });
    $('[data-skip]', el).onclick = () => { e.skipped = true; Store.save(); nextEx(); };
    $('[data-guide]', el).onclick = () => exerciseSheet(e.id);
    $('[data-swap]', el).onclick = () => swapSheet(e);
    if (r.restEnd > Date.now()) showRest();
  }
  function completeSet(i, btn) {
    const r = run(), e = r.ex[r.idx], s = e.sets[i], X = DATA.EX[e.id];
    if (s.done) {
      if (completeSet._undo === r.idx + ':' + i && Date.now() - completeSet._t < 2500) { s.done = false; s.side = 0; r.restEnd = 0; completeSet._undo = null; Store.save(); hideRest(true); render(); UI.toast('Satz zurückgesetzt'); return; }
      completeSet._undo = r.idx + ':' + i; completeSet._t = Date.now(); UI.toast('Nochmal tippen, um den Satz zurückzusetzen'); return;
    }
    if (!X.free && !e.sub && (s.w == null || s.w === '')) { UI.toast('Trag zuerst das Gewicht ein'); $$('.setrow', el)[i].querySelector('[data-wi]').focus(); return; }
    if (e.perSide && s.side === 0) {
      s.side = 1; Store.save(); FX.play('tap'); FX.buzz(10);
      UI.toast('Links geschafft. Jetzt rechts.');
      render(); return;
    }
    s.done = true; Store.save();
    FX.play('plip'); FX.buzz(15);
    const rc = btn.getBoundingClientRect(); FX.sparks(rc.left + rc.width / 2, rc.top + rc.height / 2, 7, '#9CCBB2');
    // Bestwert live erkennen
    if (!e.sub && s.w && s.r >= 8) {
      const b = Store.best(e.id);
      if ((b.w || b.r) && (s.w > b.w || (s.w === b.w && s.r > b.r)) && !e._prShown) { e._prShown = true; FX.play('pr'); UI.toast(`Neuer Bestwert bei ${Store.exName(e.id)}!`); FX.petals(rc.left, rc.top, 14); }
    }
    const allDone = e.sets.every(x => x.done);
    if (allDone && !e.sub && Store.readyToIncrease(e.id, e.sets.map(x => ({ w: +x.w, r: +x.r })))) setTimeout(() => UI.toast('Alle Sätze mit 12. Nächstes Mal schlägt Bloom mehr Gewicht vor.'), 600);
    if (!allDone) { r.restTotal = X.rest; r.restEnd = Date.now() + X.rest * 1000; Store.save(); }
    render();
    if (allDone) gsap.fromTo($('[data-next]', el), { scale: .96 }, { scale: 1, duration: .5, ease: 'elastic.out(1,.4)' });
  }
  function nextEx() {
    const r = run(); hideRest();
    if (r.idx < r.ex.length - 1) { r.idx++; Store.save(); render(); if (!FX.reduced()) gsap.fromTo('.pl-body', { x: 24, opacity: 0 }, { x: 0, opacity: 1, duration: .32, ease: 'power3.out', clearProps: 'transform,opacity' }); return; }
    r.phase = r.abs.on && r.abs.state !== 'complete' ? 'abs' : 'finish'; Store.save(); render();
  }
  function swapSheet(e) {
    const X = DATA.EX[e.id];
    const close = UI.sheet('Übung ersetzen', `<p class="muted small" style="margin-bottom:10px">Ersetzte Übungen zählen nicht für Bestwerte und Steigerungen der Originalübung.</p>
      <div class="list">${(X.alt || []).map(a => `<button class="listrow" data-a="${esc(a)}"><span class="ic-wrap">${ic('swap', 'sm')}</span><span class="grow t">${esc(a)}</span></button>`).join('')}
      ${e.sub ? `<button class="listrow" data-a=""><span class="ic-wrap">${ic('refresh', 'sm')}</span><span class="grow t">Zurück zu ${esc(Store.exName(e.id))}</span></button>` : ''}</div>
      <form class="stack" style="margin-top:12px"><input type="text" placeholder="Eigene Übung eingeben" maxlength="40" aria-label="Eigene Übung"><button class="btn block">Übernehmen</button></form>`, {
      mount: (b, cl) => {
        $$('[data-a]', b).forEach(x => x.onclick = () => { e.sub = x.dataset.a || null; Store.save(); cl(); render(); });
        $('form', b).onsubmit = ev => { ev.preventDefault(); const v = $('input', b).value.trim(); if (!v) return; e.sub = v; Store.save(); cl(); render(); };
      }
    });
  }
  /* Pausentimer */
  function showRest() {
    const r = run();
    if (restEl && restEl._ended) hideRest(true);
    if (!restEl) {
      restEl = document.createElement('div'); restEl.className = 'rest';
      restEl.innerHTML = `<div class="rest-in"><div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="#EEDFE6" stroke-width="8"/><circle class="rp" cx="50" cy="50" r="44" fill="none" stroke="#78AFD6" stroke-width="8" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"/></svg><div class="rt num" id="restT"></div></div>
        <div class="grow"><div style="font-weight:800">Pause</div><div class="small muted" id="restNext">Atme durch, gleich geht es weiter.</div><div class="row" style="margin-top:10px"><button class="btn sm soft" data-p15>+15 s</button><button class="btn sm" data-pskip>Weiter</button></div></div></div>`;
      document.body.appendChild(restEl);
      gsap.fromTo(restEl.firstElementChild, { y: '100%' }, { y: 0, duration: .4, ease: 'expo.out' });
      restEl.querySelector('[data-p15]').onclick = () => { r.restEnd += 15000; r.restTotal += 15; Store.save(); tick(); };
      restEl.querySelector('[data-pskip]').onclick = () => { r.restEnd = 0; Store.save(); hideRest(); };
    }
    tick();
  }
  function hideRest(instant) {
    if (!restEl) return; const e = restEl; restEl = null;
    if (instant) e.remove(); else gsap.to(e.firstElementChild, { y: '100%', duration: .25, ease: 'power2.in', onComplete: () => e.remove() });
  }
  function tick() {
    const r = run(); if (!r || !el) return;
    const t = $('#plTime', el); if (t) t.textContent = fdur((Date.now() - r.start) / 1000);
    if (restEl) {
      const left = Math.max(0, (r.restEnd - Date.now()) / 1000);
      $('#restT').textContent = fdur(left);
      restEl.querySelector('.rp').setAttribute('stroke-dashoffset', (100 - left / Math.max(1, r.restTotal) * 100).toFixed(2));
      if (left <= 0 && !restEl._ended) { const me = restEl; me._ended = true; r.restEnd = 0; Store.save(); FX.play('bell'); FX.buzz([60, 60, 60]); $('#restNext').textContent = 'Los geht es mit dem nächsten Satz.'; setTimeout(() => { if (restEl === me) hideRest(); }, 1200); }
      else if (left <= 3.2 && Math.ceil(left) !== tick._l) { tick._l = Math.ceil(left); FX.play('tick'); }
    } else if (r.phase === 'ex' && r.restEnd > Date.now()) showRest();
    if (restEl && restEl._ended) return;
    if (r.phase === 'abs') absTick();
  }
  /* Abs Zirkel */
  function renderAbs() {
    const r = run(), a = r.abs, id = DATA.ABS[Math.min(a.i, DATA.ABS.length - 1)];
    const nextId = DATA.ABS[a.i + 1];
    el.innerHTML = head('Abs Zirkel') + `<div class="pl-body" style="text-align:center">
      ${a.state === 'idle' ? `<h2 style="margin-top:8px">9 Übungen, je 30 Sekunden</h2><p class="muted" style="margin:6px 0 10px">Ohne Pause hintereinander, 4:30 Minuten. Gibt deiner Pflanze Sonnenlicht.</p>` : ''}
      <svg class="fig" id="absFig" style="width:100%;max-width:300px;aspect-ratio:200/160;background:#fff;border-radius:22px;margin:4px auto 0;display:block"></svg>
      <h2 style="margin-top:12px" id="absName">${esc(Store.exName(id))}</h2>
      <div class="ring absring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="#EEDFE6" stroke-width="6"/><circle class="ap" cx="50" cy="50" r="44" fill="none" stroke="#E9A58A" stroke-width="6" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"/></svg><div class="rt num" id="absT">${a.state === 'count' ? '3' : Math.ceil(a.left)}</div></div>
      <div class="absnext" id="absNext">${nextId ? 'Als Nächstes: ' + esc(Store.exName(nextId)) : 'Letzte Übung'}</div>
      <div class="abslist">${DATA.ABS.map((_, i) => `<i class="${i < a.i ? 'done' : i === a.i ? 'cur' : ''}"></i>`).join('')}</div>
      <p class="small muted">${esc(DATA.EX[id].cue)}</p>
    </div>
    <div class="pl-foot">${a.state === 'idle' || a.state === 'stopped' || a.state === 'complete' ? `<button class="btn white" data-absfin>Zum Abschluss</button><button class="btn grow" data-absgo>${ic(a.state === 'idle' ? 'play' : 'refresh', 'sm')} ${a.state === 'idle' ? 'Zirkel starten' : 'Neu starten'}</button>` :
        `<button class="btn white" data-absskip>Beenden</button><button class="btn grow ${a.state === 'paused' ? '' : 'soft'}" data-abspause>${a.state === 'paused' ? ic('play', 'sm') + ' Weiter' : ic('pause', 'sm') + ' Pause'}</button>`}</div>`;
    Figure.mount($('#absFig', el), id);
    const go = $('[data-absgo]', el); if (go) go.onclick = () => { if (a.state !== 'idle') { a.i = 0; a.done = 0; a.clean = true; a.left = 30; } absStart(); };

function lineChart(fig, pts, opts = {}) {
  const svg = fig.querySelector('svg');
  const draw = () => {
    const W = fig.clientWidth, H = fig.clientHeight; if (!W) return;
    if (!pts.length) { svg.innerHTML = ''; return; }
    const pad = { l: 36, r: 10, t: 14, b: 24 };
    const ys = pts.map(p => p.y), vs = pts.map(p => p.v || 0);
    let y0 = Math.min(...ys), y1 = Math.max(...ys); if (y0 === y1) { y0 -= 2; y1 += 2; }
    const span = y1 - y0; y0 = Math.max(0, y0 - span * .15); y1 += span * .15;
    const vmax = Math.max(1, ...vs);
    const X = i => pad.l + (pts.length === 1 ? (W - pad.l - pad.r) / 2 : i / (pts.length - 1) * (W - pad.l - pad.r));
    const Y = v => pad.t + (1 - (v - y0) / (y1 - y0)) * (H - pad.t - pad.b);
    const bw = Math.max(3, Math.min(18, (W - pad.l - pad.r) / pts.length * .5));
    let s = '';
    for (let k = 0; k <= 2; k++) { const v = y0 + (y1 - y0) * k / 2, y = Y(v); s += `<path d="M${pad.l} ${y.toFixed(1)}H${W - pad.r}" stroke="#EEDFE6" stroke-width="1"/>${W > 300 || k !== 1 ? `<text x="${pad.l - 6}" y="${(y + 4).toFixed(1)}" text-anchor="end">${nf(v, 1)}</text>` : ''}`; }
    pts.forEach((p, i) => { const h = (p.v || 0) / vmax * (H - pad.t - pad.b) * .45; s += `<rect x="${(X(i) - bw / 2).toFixed(1)}" y="${(H - pad.b - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="#E6DDF5"/>`; });
    const d = pts.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join('');
    s += `<path d="${d}" fill="none" stroke="#7360A8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach((p, i) => { s += `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${p.pr ? 5 : 3.5}" fill="${p.pr ? '#E9A58A' : '#fff'}" stroke="#7360A8" stroke-width="2"><title>${p.label}: ${nf(p.y, 1)} kg</title></circle>`; });
    s += `<text x="${pad.l}" y="${H - 6}">${pts[0].label}</text>${pts.length > 1 ? `<text x="${W - pad.r}" y="${H - 6}" text-anchor="end">${pts[pts.length - 1].label}</text>` : ''}`;
    svg.innerHTML = s;
  };
  if (lineChart.ro) lineChart.ro.disconnect();
  lineChart.ro = new ResizeObserver(draw); lineChart.ro.observe(fig); draw();
}
